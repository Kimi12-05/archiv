/* ---------- Dropbox ---------- */
const DBX_KEY='tmebvc4g71gd61z';
const DBX_RED=new URL('./',location.href).href;
const DBX_SCOPE='files.metadata.read files.content.read files.content.write';
let dbx={refresh:null,access:null,exp:0},dbxErr='',cspHit='',weg='direkt';
const b64url=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const TOKEN_URLS=['https://api.dropboxapi.com/oauth2/token','https://api.dropbox.com/oauth2/token'];
const PX=u=>'./__p?u='+encodeURIComponent(u);
const FREMD=u=>'https://corsproxy.io/?key=fc490158&url='+encodeURIComponent(u);

document.addEventListener('securitypolicyviolation',e=>{
  cspHit=(e.violatedDirective||'?')+' → '+(e.blockedURI||'?');
});

async function ueberWeg(w,url,opts){
  if(w==='sw'){
    if(!navigator.serviceWorker.controller)throw new Error('kein Vermittler aktiv');
    const r=await fetch(PX(url),opts);
    if(r.headers.get('X-Proxy')!=='1')throw new Error('Vermittler antwortet nicht');
    if(r.status===599)throw new Error('Vermittler: '+(await r.text()).slice(0,140));
    return r;
  }
  if(w==='direkt')return await fetch(url,opts);
  return await fetch(FREMD(url),opts);
}
async function dbxFetch(url,opts){
  const order=weg==='direkt'?['direkt','sw','fremd']:weg==='fremd'?['fremd','sw','direkt']:['sw','direkt','fremd'];
  const errs=[];
  for(const w of order){
    try{const r=await ueberWeg(w,url,opts);weg=w;return r;}
    catch(e){errs.push(w+': '+((e&&e.message)||e));}
  }
  throw new Error(errs.join(' | '));
}
async function dbxPost(url,body){
  return await dbxFetch(url,{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body});
}

async function dbxConnect(){
  dbxErr='';
  try{
    if(!(window.crypto&&crypto.subtle)){dbxErr='Kein sicherer Kontext (https nötig)';render();return;}
    const v=b64url(crypto.getRandomValues(new Uint8Array(48)));
    const h=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
    await dbSet('dbxv',v);
    try{sessionStorage.setItem('dbxv',v);}catch(e){}
    try{localStorage.setItem('dbxv',v);}catch(e){}
    location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({
      client_id:DBX_KEY,response_type:'code',code_challenge:h,code_challenge_method:'S256',
      token_access_type:'offline',scope:DBX_SCOPE,redirect_uri:DBX_RED});
  }catch(e){dbxErr='Start fehlgeschlagen: '+(e&&e.message?e.message:e);render();}
}

async function dbxExchange(code,v){
  const body=new URLSearchParams({code:code,grant_type:'authorization_code',client_id:DBX_KEY,
    code_verifier:v,redirect_uri:DBX_RED}).toString();
  let last='';
  for(const url of TOKEN_URLS){
    const host=url.replace('https://','').split('/')[0];
    try{
      const r=await dbxPost(url,body);
      const txt=await r.text();
      let j={};try{j=JSON.parse(txt);}catch(e){}
      if(j.refresh_token)return {ok:true,data:j};
      last='['+host+'] HTTP '+r.status+': '+((j.error_description||j.error||txt)||'').slice(0,200);
    }catch(e){last='['+host+'] '+(e&&e.message?e.message:e);}
  }
  return {ok:false,msg:last+'  (Weg: '+weg+')'};
}

async function dbxHandleRedirect(){
  let p;try{p=new URLSearchParams(location.search);}catch(e){return false;}
  const code=p.get('code'),err=p.get('error');
  if(!code){if(err)dbxErr='Dropbox meldet: '+err;return false;}
  let v=await dbGet('dbxv');
  if(!v){try{v=sessionStorage.getItem('dbxv');}catch(e){}}
  if(!v){try{v=localStorage.getItem('dbxv');}catch(e){}}
  if(!v){dbxErr='Prüfschlüssel verloren – nochmal auf „Mit Dropbox verbinden" tippen.';return true;}
  const res=await dbxExchange(code,v);
  if(res.ok){
    dbx={refresh:res.data.refresh_token,access:res.data.access_token,exp:Date.now()+((res.data.expires_in||14400)*1000)};
    dbxErr='';await dbSet('dbx',JSON.stringify(dbx));
    try{history.replaceState(null,'',DBX_RED);}catch(e){}
  }else{dbxErr='Austausch fehlgeschlagen: '+res.msg;}
  return true;
}

async function dbxTest(){
  dbxErr='Teste…';cspHit='';render();
  const out=[];
  out.push('Vermittler: '+(swStatus||'unbekannt'));
  out.push('aktiv: '+(navigator.serviceWorker&&navigator.serviceWorker.controller?'ja':'nein'));
  try{const rs=await navigator.serviceWorker.getRegistrations();out.push('angemeldet: '+rs.length);}catch(e){out.push('angemeldet: ?');}
  const rdy=await Promise.race([
    navigator.serviceWorker.ready.then(()=>'bereit').catch(()=>'Fehler'),
    new Promise(r=>setTimeout(()=>r('Zeit abgelaufen'),2500))]);
  out.push('bereit: '+rdy);
  try{
    const r=await fetch('./index.html?c='+Date.now());
    out.push('CSP: '+(r.headers.get('content-security-policy')||'keine'));
  }catch(e){out.push('CSP: '+((e&&e.message)||e));}
  try{

  }catch(e){out.push('Vermittler-Test: '+((e&&e.message)||e));}
  out.push('CSP-Treffer: '+(cspHit||'keine'));

}

async function killSW(){
  dbxErr='Vermittler wird entfernt…';render();
  try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();}catch(e){}
  try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}
  dbxErr='Entfernt. Seite lädt neu…';render();
  setTimeout(()=>{try{location.reload();}catch(e){}},1200);
}

async function dbxToken(){
  if(dbx.access&&Date.now()<dbx.exp-60000)return dbx.access;
  if(!dbx.refresh)return null;
  const body='grant_type=refresh_token&refresh_token='+encodeURIComponent(dbx.refresh)+'&client_id='+DBX_KEY;
  for(const url of TOKEN_URLS){
    try{
      const r=await dbxPost(url,body);
      const j=await r.json();
      if(j.access_token){dbx.access=j.access_token;dbx.exp=Date.now()+((j.expires_in||14400)*1000);await dbSet('dbx',JSON.stringify(dbx));return dbx.access;}
      dbxErr='Token erneuern: '+(j.error_description||j.error||'unbekannt');
    }catch(e){dbxErr='Token erneuern fehlgeschlagen: '+((e&&e.message)||e);}
  }
  return null;
}
async function dbxMeta(path){
  const t=await dbxToken();if(!t)return null;
  const r=await dbxFetch('https://api.dropboxapi.com/2/files/get_metadata',{method:'POST',
    headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({path:path})});
  if(r.status===409)return null;
  if(!r.ok)throw new Error('meta '+r.status+': '+(await r.text()).slice(0,140));
  return await r.json();
}
async function dbxUpload(path,text){
  const t=await dbxToken();if(!t)return null;
  const r=await dbxFetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',
    headers:{'Authorization':'Bearer '+t,'Content-Type':'application/octet-stream',
      'Dropbox-API-Arg':JSON.stringify({path:path,mode:'overwrite',mute:true,autorename:false})},
    body:text});
  if(!r.ok){const x=await r.text();throw new Error('Upload '+r.status+': '+x.slice(0,140));}
  return (await r.json()).server_modified;
}
async function dbxDownload(path){
  const t=await dbxToken();if(!t)return null;
  const r=await dbxFetch('https://content.dropboxapi.com/2/files/download',{method:'POST',
    headers:{'Authorization':'Bearer '+t,'Dropbox-API-Arg':JSON.stringify({path:path})}});
  if(r.status===409)return null;
  if(!r.ok)throw new Error('Download '+r.status);
  return await r.text();
}
let syncing=false,st=null,imgPushed=true;
function queueSync(){if(!dbx.refresh)return;clearTimeout(st);st=setTimeout(()=>syncNow(false),2500);}
async function syncNow(manual){
  if(!dbx.refresh){if(manual)say('Nicht mit Dropbox verbunden');return;}
  if(syncing)return;syncing=true;
  if(manual)say('Synchronisiere…');
  try{
    await flushNow();
    const meta=await dbxMeta('/state.json');
    const rev=meta?meta.server_modified:null;
    if(rev&&rev!==S.settings.rev){
      const txt=await dbxDownload('/state.json');
      if(txt){S=normalize(JSON.parse(txt));S.settings.rev=rev;
        const im=await dbxDownload('/images.json');
        if(im){try{IMG=JSON.parse(im);}catch(e){}}
        imgPushed=true;
        await dbSet('state',JSON.stringify(S));await dbSet('images',JSON.stringify(IMG));
        S.settings.lastSync=Date.now();dbxErr='';render();say('Aktualisiert');}
    }else{
      const nr=await dbxUpload('/state.json',JSON.stringify(S));
      if(!imgPushed){await dbxUpload('/images.json',JSON.stringify(IMG));imgPushed=true;}
      if(nr){S.settings.rev=nr;S.settings.lastSync=Date.now();await dbSet('state',JSON.stringify(S));}
      dbxErr='';
      if(manual)say('Synchronisiert');
    }
  }catch(e){dbxErr=((e&&e.message)||e)+'';if(manual)say('Sync fehlgeschlagen');}
  syncing=false;if(route.name==='settings')render();
}

function render(){
 app.dataset.theme=S.settings.theme;
 tc.setAttribute('content',THEME_COLORS[S.settings.theme]||'#0f1115');
 const showNav=route.name!=='login';
 nav.style.display=showNav?'':'none';
 if(showNav){
  nav.innerHTML=`<button data-act="back" ${stack.length?'':'disabled'}><b>‹</b>Zurück</button>
   <button data-act="home" class="${route.name==='home'?'on':''}"><b>⌂</b>Start</button>
   <button data-act="settings" class="${route.name==='settings'?'on':''}"><b>⚙</b>Einstellungen</button>`;

 else top.innerHTML=`<h2>${esc(TITLES[route.name]||'')}</h2>`;
 view.innerHTML=(VIEWS[route.name]||VIEWS.home)();

function renderResults(){
 const box=$('results');if(!box)return;
 if(!q){box.innerHTML='';return;}
 const t=q.toLowerCase();
 const pf=S.performers.filter(p=>p.name.toLowerCase().includes(t)||p.cats.join(' ').toLowerCase().includes(t));
 const fl=S.performers.flatMap(p=>p.films.filter(f=>f.t.toLowerCase().includes(t)).map(f=>({f:f,p:p})));
 const pr=S.profiles.filter(p=>p.name.toLowerCase().includes(t)||p.fields.some(x=>String(x.value).toLowerCase().includes(t)));
 const st=S.profiles.flatMap(p=>p.stories.filter(s=>(s.title+' '+s.text).toLowerCase().includes(t)).map(s=>({s:s,p:p})));
 const ca=S.categories.filter(c=>c.name.toLowerCase().includes(t));
 if(!(pf.length||fl.length||pr.length||st.length||ca.length)){box.innerHTML='<p class="hint">Nichts gefunden.</p>';return;}
 box.innerHTML=
  (pf.length?`<div class="resgrp"><h3>Darstellerinnen</h3>${pf.map(p=>`<div class="res" data-act="go" data-id="performer" data-val="${p.id}">${img(p.img,p.name)}<div><b>${esc(p.name)}</b><i>${p.films.length} Filme</i></div></div>`).join('')}</div>`:'')+
  (fl.length?`<div class="resgrp"><h3>Filme</h3>${fl.map(x=>`<div class="res" data-act="openlink" data-url="${esc(x.f.u)}"><div class="ph"></div><div><b>${esc(x.f.t)}</b><i>${esc(x.p.name)} · ${esc(x.f.d)}</i></div></div>`).join('')}</div>`:'')+
  (pr.length?`<div class="resgrp"><h3>Steckbriefe</h3>${pr.map(p=>`<div class="res" data-act="go" data-id="profile" data-val="${p.id}">${img(p.img,p.name)}<div><b>${esc(p.name)}</b><i>${p.stories.length} Storys</i></div></div>`).join('')}</div>`:'')+
  (st.length?`<div class="resgrp"><h3>Storys</h3>${st.map(x=>`<div class="res" data-act="readstory" data-id="${x.p.id}:${x.s.id}"><div class="ph"></div><div><b>${esc(x.s.title)}</b><i>${esc(x.p.name)}</i></div></div>`).join('')}</div>`:'')+
  (ca.length?`<div class="resgrp"><h3>Kategorien</h3>${ca.map(c=>`<div class="res" data-act="go" data-id="category" data-val="${c.id}">${img(c.img,c.name)}<div><b>${esc(c.name)}</b></div></div>`).join('')}</div>`:'');
}

function download(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ---------- Klicks ---------- */
app.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id,v=el.dataset.val;
 const P_=()=>find(S.performers,route.id);
 if(a==='login'){doLogin();}
 else if(a==='logout'){S.settings.user=null;save();route={name:'login'};stack=[];render();}
 else if(a==='back'){back();}
 else if(a==='home'){stack=[];route={name:'home'};q='';tagFilter='';editFields=false;render();}
 else if(a==='search'){go('search');}
 else if(a==='settings'){if(route.name!=='settings')go('settings');}
 else if(a==='go'){go(id,v);}
 else if(a==='acc'){acc[v]=!acc[v];render();}
 else if(a==='close'){closeModal();}
 else if(a==='saveki'){const k=(($('kikey')||{}).value||'').trim();
  try{localStorage.setItem('venice_key',k);}catch(err){}
  say(k?'Key gemerkt – Seite neu laden':'Key leer');}
 else if(a==='beschreiben'){const p=find(S.profiles,id);if(!p)return;
  say('Denke nach…');
  beschreibung(p).then(t=>{

function applyImport(d){
 if(!d)return say('Unbekanntes Format');
 let st,im=null;
 if(d.state){st=d.state;im=d.images||null;}
 else if(d.performers){st=d;}
 else return say('Unbekanntes Format');
 S=normalize(st);
 if(im&&typeof im==='object'){IMG=im;imgDirty=true;}
 saveImgs();save();closeModal();route={name:'home'};stack=[];render();say('Import erfolgreich');
}

function shrink(file,cb,max){max=max||1200;
 const r=new FileReader();
 r.onload=()=>{const im=new Image();
  im.onload=()=>{let w=im.width||1,h=im.height||1;
   const sc=Math.min(1,max/Math.max(w,h));
   w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(im,0,0,w,h);
   try{cb(c.toDataURL('image/jpeg',0.78));}catch(e){cb(null);}};
  im.onerror=()=>cb(null);
  im.src=r.result;};
 r.onerror=()=>cb(null);
 r.readAsDataURL(file);
}

function parseDur(s){if(!s)return null;let m;
 if(m=s.match(/[?&]t=(\d+)/))return fmt(+m[1]);
 if((m=s.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/i))&&(m[1]||m[2]||m[3]))
  return fmt((+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0));
 if(m=s.match(/(\d{1,3})\s*min(?:uten)?\s*(\d{1,2})?(?:[^\d]|$)/i))return m[1]+':'+String(m[2]||0).padStart(2,'0');
 if(m=s.match(/(\d{1,2})[mM](\d{1,2})[sS]/))return m[1]+':'+String(m[2]).padStart(2,'0');
 if(m=s.match(/(?:^|[^\d])(\d{1,2})[-_:](\d{2})(?:[^\d]|$)/)){if(+m[2]<60)return m[1]+':'+m[2];}
 return null;}
function detect(u){const local=parseDur(u);if(local)return Promise.resolve(local);
 if(!u||!/^https?:/.test(u))return Promise.resolve(null);
 return dbxFetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u),{})
   .then(r=>r.text()).then(h=>{
  const m=h.match(/"duration"\s*:\s*"([^"]+)"/i)||h.match(/itemprop="duration"[^>]*content="([^"]+)"/i)||h.match(/"length"\s*:\s*(\d+)/i);
  return m?parseDur(m[1]):null;}).catch(()=>null);}

function showLight(){
 const k=light.dataset.kind,id=light.dataset.id,i=+light.dataset.idx;
 const o=k==='perf'?find(S.performers,id):find(S.categories,id);
 if(!o)return;const arr=o.pics,cur=arr[i];if(!cur)return;
 light.innerHTML=`<button class="cl" data-act="lightclose">×</button>
  ${arr.length>1?'<button class="nav2 l" data-act="lightprev">‹</button><button class="nav2 r" data-act="lightnext">›</button>':''}
  <img src="${esc(srcOf(cur.src))}" alt=""><div class="cap">${i+1} / ${arr.length}${cur.cat?' · '+esc(cur.cat):''}</div>`;
 light.classList.add('show');}
